<style>

:root{--h:165;--c:.11;

 --font:"Tajawal","Segoe UI",Tahoma,sans-serif;--display:"Readex Pro",var(--font);color-scheme:light}

:root[data-font="cairo"]{--font:"Cairo","Segoe UI",sans-serif;--display:"Cairo",sans-serif}:root[data-font="plex"]{--font:"IBM Plex Sans Arabic","Segoe UI",sans-serif}:root[data-font="almarai"]{--font:"Almarai","Segoe UI",sans-serif;--display:"Almarai",sans-serif}:root[data-font="kufi"]{--font:"Noto Kufi Arabic","Segoe UI",sans-serif;--display:"Noto Kufi Arabic",sans-serif}:root[data-font="messiri"]{--display:"El Messiri",var(--font)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:oklch(.18 .012 var(--h));--surface:oklch(.22 .014 var(--h));--sunk:oklch(.26 .016 var(--h));--ink:oklch(.94 .01 var(--h));--muted:oklch(.74 .02 var(--h));--line:oklch(.33 .016 var(--h));--accent:oklch(.76 .12 var(--h));--accent-soft:oklch(.31 .05 var(--h));--accent-ink:oklch(.2 .03 var(--h));--brass:oklch(.8 .12 75);color-scheme:dark}}
:root[data-theme="dark"]{--bg:oklch(.18 .012 var(--h));--surface:oklch(.22 .014 var(--h));--sunk:oklch(.26 .016 var(--h));--ink:oklch(.94 .01 var(--h));--muted:oklch(.74 .02 var(--h));--line:oklch(.33 .016 var(--h));--accent:oklch(.76 .12 var(--h));--accent-soft:oklch(.31 .05 var(--h));--accent-ink:oklch(.2 .03 var(--h));--brass:oklch(.8 .12 75);color-scheme:dark}
html{font-size:17px;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.75}
*{box-sizing:border-box}h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3;text-wrap:balance}p{margin:0}
svg.i{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in oklch,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
header .wrap{display:flex;align-items:center;gap:14px;min-height:68px}
.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
header b{font-family:var(--display);font-size:1.05rem;line-height:1.2}
header nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
header nav a{color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:10px;font-weight:600}
header nav a:hover{background:var(--sunk)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;min-height:46px;padding:6px 20px;font-weight:700;text-decoration:none;border:1.5px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer;font:inherit;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in oklch,var(--accent) 55%,var(--accent-2)));color:var(--accent-ink);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding-block:56px}
.hero h1{font-size:clamp(1.9rem,4.2vw,3rem)}
.hero p{font-size:1.12rem;opacity:.92;margin-top:14px;max-width:46ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hero .cta .btn{border-color:#ffffff66;background:#ffffff1f;color:inherit}
.hero .cta .btn.pri{background:var(--surface);color:var(--accent);border-color:var(--surface)}
.hero svg.art{width:100%;max-width:440px;justify-self:center}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:28px}
.stats b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1.2}
.stats span{opacity:.85;font-size:.9rem}
section.s{padding-block:56px}
section.s>.wrap>h2{font-size:clamp(1.4rem,3vw,2rem)}

.alt{background:var(--sunk)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin-top:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.card .ci{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.card .ci svg{width:28px;height:28px}
.card h3{font-size:1.1rem}.card p{color:var(--muted)}
.stage-kg .ci{color:oklch(.58 .15 350);background:oklch(.94 .03 350)}.stage-mid .ci{color:oklch(.52 .14 255);background:oklch(.94 .03 255)}.stage-sec .ci{color:oklch(.55 .14 295);background:oklch(.94 .03 295)}

.grades span{background:var(--sunk);border-radius:999px;padding:1px 10px;font-size:.82rem}
.fees{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:26px}
.fee{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.fee .big{font-family:var(--display);font-size:1.7rem;color:var(--brass);font-variant-numeric:tabular-nums}
.fee table{width:100%;border-collapse:collapse;font-size:.92rem}.fee td{padding:6px 0;border-bottom:1px solid var(--line)}.fee td:last-child{text-align:end;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-self:flex-start;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 12px;font-size:.82rem;font-weight:700}
.pays{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.pays span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-weight:600}
.pays i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:.72rem;font-weight:800}
.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;margin-top:26px}
.news article{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.news img{width:100%;aspect-ratio:16/9;object-fit:cover;max-width:100%}
.news .ph{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--sunk));color:var(--accent)}
.news .ph svg{width:56px;height:56px}
.news div.b{padding:16px;display:flex;flex-direction:column;gap:6px}.news time{color:var(--muted);font-size:.85rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
ol.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
ol.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
ol.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
ul.docs{margin:10px 0 0;padding-inline-start:20px;color:var(--muted)}
form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;align-content:start}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--muted);font-size:.9rem}
input,select,textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;min-height:48px;padding:8px 12px;font:inherit;color:var(--ink);width:100%}
textarea{min-height:80px}.full{grid-column:1/-1}
.ok-msg{grid-column:1/-1;background:var(--accent-soft);border-radius:12px;padding:14px;font-weight:700}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:700;min-height:28px}
details p{color:var(--muted);margin-top:8px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin-top:22px}
.contact div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}
.contact b{display:block;font-variant-numeric:tabular-nums}

footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.app-cta{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:26px}

/* ---------- ready-made templates ---------- */
.hero.has-img{background:linear-gradient(90deg,oklch(.25 .06 var(--h) / .92),oklch(.25 .06 var(--h) / .55)),var(--hero) center/cover}
.photo-frame{width:100%;max-width:440px;aspect-ratio:4/3;object-fit:cover;border-radius:24px;box-shadow:0 20px 40px -18px #0008;justify-self:center}
/* classic */
.tpl-classic{--display:"Amiri","El Messiri",serif}
.tpl-classic .hero{background:var(--surface);color:var(--ink);border-bottom:6px double var(--accent)}
.tpl-classic .hero .wrap{grid-template-columns:1fr;text-align:center;justify-items:center}
.tpl-classic .hero p{margin-inline:auto}
.tpl-classic .hero .cta{justify-content:center}
.tpl-classic .hero .cta .btn{background:var(--surface);color:var(--accent);border-color:var(--accent)}
.tpl-classic .hero .cta .btn.pri{background:var(--accent);color:var(--accent-ink)}
.tpl-classic .hero svg.art{max-width:300px;color:var(--accent)}
.tpl-classic .stats{justify-content:center}
.tpl-classic section.s>.wrap>h2{text-align:center}
.tpl-classic section.s>.wrap>h2::after{content:"";display:block;width:90px;height:3px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.tpl-classic section.s>.wrap>p.lead{margin-inline:auto;text-align:center}
.tpl-classic .card,.tpl-classic .fee{border-top:4px solid var(--brass);border-radius:6px}
/* playful (kindergarten) */
.tpl-playful{--font:"Almarai","Segoe UI",sans-serif;--display:"Almarai",sans-serif}
.tpl-playful .hero{position:relative;padding-bottom:40px;background:radial-gradient(circle at 6% 18%,oklch(.85 .12 calc(var(--h) + 60)) 0 70px,transparent 71px),radial-gradient(circle at 44% 96%,oklch(.86 .12 calc(var(--h) - 60)) 0 110px,transparent 111px),linear-gradient(135deg,var(--accent),var(--accent-2))}
.tpl-playful .hero::after{content:"";position:absolute;inset:auto 0 -1px 0;height:46px;background:var(--bg);clip-path:path('M0 30 Q 180 0 360 30 T 720 30 T 1080 30 T 1440 30 T 1800 30 T 2160 30 V 60 H 0 Z')}
.tpl-playful .card,.tpl-playful .fee,.tpl-playful .news article{border-radius:28px;border-width:2px}
.tpl-playful .cards .card:nth-child(4n+1) .ci{background:oklch(.93 .06 350);color:oklch(.55 .17 350)}
.tpl-playful .cards .card:nth-child(4n+2) .ci{background:oklch(.94 .06 85);color:oklch(.6 .14 70)}
.tpl-playful .cards .card:nth-child(4n+3) .ci{background:oklch(.93 .06 220);color:oklch(.52 .14 240)}
.tpl-playful .cards .card:nth-child(4n+4) .ci{background:oklch(.93 .06 150);color:oklch(.5 .13 150)}
.tpl-playful .card .ci{border-radius:50%;width:60px;height:60px}
.tpl-playful .btn{border-radius:999px}
/* academic */
.tpl-academic{--font:"IBM Plex Sans Arabic","Segoe UI",sans-serif;--display:"Noto Kufi Arabic",sans-serif}
.tpl-academic header.nav{background:oklch(.24 .05 var(--h));border-color:transparent}
.tpl-academic header.nav b,.tpl-academic header nav a{color:#fff}
.tpl-academic header nav a:hover{background:#ffffff1a}
.tpl-academic .hero{background:linear-gradient(160deg,oklch(.26 .06 var(--h)),oklch(.34 .08 calc(var(--h) + 30)))}
.tpl-academic .stats{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px 22px;box-shadow:0 18px 40px -20px #000a}
.tpl-academic .stats span{color:var(--muted);opacity:1}
.tpl-academic .card,.tpl-academic .fee,.tpl-academic .news article{border-radius:8px}
.tpl-academic section.s>.wrap>h2{border-inline-start:6px solid var(--accent);padding-inline-start:14px}
/* minimal */
.tpl-minimal .hero{background:var(--bg);color:var(--ink)}
.tpl-minimal .hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);letter-spacing:-.01em}
.tpl-minimal .hero h1::after{content:"";display:block;width:120px;height:8px;border-radius:4px;background:var(--accent);margin-top:16px}
.tpl-minimal .hero .cta .btn{background:transparent;color:var(--ink);border-color:var(--ink)}
.tpl-minimal .hero .cta .btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tpl-minimal .hero svg.art{color:var(--accent)}
.tpl-minimal .alt{background:transparent;border-block:1px solid var(--line)}
.tpl-minimal .card,.tpl-minimal .fee{background:transparent;box-shadow:none}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px;margin-top:22px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;max-width:100%}
@media (max-width:860px){.hero .wrap,.split{grid-template-columns:1fr}header nav{display:none}.hero svg.art{max-width:300px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
footer .dev{display:inline-flex;align-items:center;gap:10px}footer .dev img{border-radius:50%;background:#fff}footer .dev a{color:inherit;font-weight:700}
.langpick select{border:1px solid rgba(127,127,127,.35);border-radius:10px;background:transparent;color:inherit;font:inherit;padding:6px 8px;margin-inline:8px}
